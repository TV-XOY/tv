name: Actualizar Guia StarTV EPG

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a la medianoche (UTC)
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña "Actions"

permissions:
  contents: write # Permiso crucial para que el bot pueda guardar el archivo en tu repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install requests beautifulsoup4

    - name: Ejecutar script de scraping
      run: python script_epg.py

    - name: Subir cambios al repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add guia-starttv.xml.gz
        git commit -m "Actualizacion automatica de EPG - $(date +'%Y-%m-%d')" || exit 0
        git push
