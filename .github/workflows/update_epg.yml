name: Actualizar EPG Diariamente

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC (puedes ajustar la hora)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si lo deseas

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio en el servidor de GitHub
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar el entorno de Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    # 3. Instalar las librerías necesarias para tu script
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Ejecutar tu script extractor
    - name: Ejecutar script de EPG
      run: python grab_epg.py

    # 5. Guardar los cambios y subirlos al repositorio automáticamente
    - name: Hacer commit y push del EPG actualizado
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.name "github-actions[bot]@users.noreply.github.com"
        git add runtime_epg.xml
        git commit -m "Actualización automática de EPG: $(date +'%Y-%m-%d')" || exit 0
        git push
